name: combinewrt image

on:
  repository_dispatch:
    types: [combinewrt-build]

run-name: combinewrt-${{ github.event.client_payload.buildId }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare plan
        run: |
          set -euo pipefail
          jq '.client_payload' "$GITHUB_EVENT_PATH" > plan.json
          jq -e '.artifactName and .imageType and .profileId and .baseVersion' plan.json >/dev/null
          echo "PLAN_ARTIFACT=$(jq -r .artifactName plan.json)" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd jq qemu-utils genisoimage

      - name: Download ImageBuilder
        run: |
          set -euo pipefail
          BASE=$(jq -r .baseVersion plan.json)
          URL="https://downloads.immortalwrt.org/releases/${BASE}/targets/x86/64/immortalwrt-imagebuilder-${BASE}-x86-64.Linux-x86_64.tar.zst"
          echo "Downloading $URL"
          curl -fL --retry 3 --retry-delay 5 -o ib.tar.zst "$URL"
          ls -l ib.tar.zst
          mkdir ib
          tar --zstd -xf ib.tar.zst -C ib --strip-components=1

      - name: Write files
        run: |
          set -euo pipefail
          cd ib
          jq -c '.files[]' ../plan.json | while IFS= read -r file; do
            path=$(echo "$file" | jq -r .path)
            mode=$(echo "$file" | jq -r '.mode // 420')
            mkdir -p "$(dirname "$path")"
            echo "$file" | jq -r .content > "$path"
            chmod "$(printf '%o' "$mode")" "$path"
          done
          find files -type f | sort
          echo 'uci-defaults written (contents not printed: they contain the root password hash)'

      - name: Build image
        run: |
          set -euo pipefail
          cd ib
          PROFILE=$(jq -r .profileId ../plan.json)
          PACKAGES=$(jq -r '.packages | join(" ")' ../plan.json)
          echo "COMBINEWRT_PROFILE=$PROFILE"
          echo "COMBINEWRT_PACKAGES=$PACKAGES"
          echo "COMBINEWRT_MAKE=make -j$(nproc) image PROFILE=\"$PROFILE\" PACKAGES=\"$PACKAGES\" FILES=files"
          make -j"$(nproc)" image PROFILE="$PROFILE" PACKAGES="$PACKAGES" FILES=files \
            CONFIG_ISO_IMAGES= CONFIG_QCOW2_IMAGES= CONFIG_VDI_IMAGES= CONFIG_VMDK_IMAGES= CONFIG_VHDX_IMAGES= 2>&1 | tee build.log

      - name: Package artifact
        run: |
          set -euo pipefail
          cd ib
          ARTIFACT=$(jq -r .artifactName ../plan.json)
          IMG=$(find bin/targets -type f -name "$ARTIFACT" | head -1)
          if [ -z "$IMG" ]; then
            echo "expected artifact $ARTIFACT was not produced" >&2
            find bin/targets -type f | sort >&2
            exit 1
          fi
          gzip -t "$IMG"
          SHA=$(sha256sum "$IMG" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$IMG")
          jq -c -n --arg artifactName "$ARTIFACT" --arg path "$PWD/$IMG" --arg sha256 "$SHA" --argjson size "$SIZE" \
            '{artifactName:$artifactName,path:$path,sha256:$sha256,size:$size}' > manifest.json
          cat manifest.json
          echo "COMBINEWRT_MANIFEST=$(cat manifest.json)"
          echo "ARTIFACT_PATH=$PWD/$IMG" >> "$GITHUB_ENV"
          echo "MANIFEST_PATH=$PWD/manifest.json" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLAN_ARTIFACT }}
          path: |
            ${{ env.ARTIFACT_PATH }}
            ${{ env.MANIFEST_PATH }}
          retention-days: 7
          if-no-files-found: error
