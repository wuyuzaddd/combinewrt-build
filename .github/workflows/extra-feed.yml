name: combinewrt extra feed

on:
  workflow_dispatch:
    inputs:
      op_packages_commit:
        description: op-packages commit to build
        required: false
        default: 18b7d51c1
  repository_dispatch:
    types: [extra-feed]

permissions:
  contents: write
  actions: read

jobs:
  extra-feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SDK_URL: https://downloads.immortalwrt.org/releases/25.12.2/targets/x86/64/immortalwrt-sdk-25.12.2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
      OP_PACKAGES_REPO: kiddin9/op-packages
      PACKAGES: >-
        luci-app-lucky lucky luci-app-subconverter luci-app-fastnet fastnet
        linkease-app-entry luci-lib-linkeaseauth luci-app-bandix openwrt-bandix
        luci-app-store luci-lib-taskd luci-app-wrtbwmon wrtbwmon luci-app-webdav
        luci-app-substore luci-app-partexp luci-app-mosdns geo2txt
        luci-app-ipsec-server luci-app-fwlive luci-app-gately gately
    steps:
      - uses: actions/checkout@v7

      - name: Resolve op-packages commit
        run: |
          commit="${{ github.event.client_payload.op_packages_commit }}"
          [ -n "$commit" ] || commit="${{ inputs.op_packages_commit }}"
          [ -n "$commit" ] || commit="18b7d51c1"
          echo "OP_COMMIT=$commit" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3-yaml

      - name: Download SDK
        run: |
          curl -fsSL "$SDK_URL" -o /tmp/sdk.tar.zst
          mkdir -p sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C sdk --strip-components=1

      - name: Fetch op-packages
        run: |
          git clone --filter=blob:none "https://github.com/$OP_PACKAGES_REPO" /tmp/op-packages
          git -C /tmp/op-packages checkout "$OP_COMMIT"
          mkdir -p /tmp/extra
          for p in $PACKAGES; do
            cp -a "/tmp/op-packages/$p" "/tmp/extra/$p"
            sed -i -E 's/^(PKG_VERSION:=.*)-r[0-9]+$/\1/' "/tmp/extra/$p/Makefile"
          done

      - name: Set up feeds
        run: |
          cd sdk
          cp feeds.conf.default feeds.conf 2>/dev/null || true
          echo "src-link extra /tmp/extra" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Build packages
        run: |
          cd sdk
          for p in $PACKAGES; do
            echo "::group::build $p"
            if ! make -j"$(nproc)" "package/feeds/extra/$p/compile" V=s; then
              echo "COMBINEWRT_FAILED_PACKAGE=$p"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Assemble feed and manifest
        run: |
          SDK_DIR="$GITHUB_WORKSPACE/sdk"
          FEED_DIR="$SDK_DIR/bin/packages/x86_64/extra"
          ls -l "$FEED_DIR"
          mkdir -p /tmp/feed
          cp "$FEED_DIR"/*.apk "$FEED_DIR"/packages.adb /tmp/feed/
          APK_BIN="$(find "$SDK_DIR" -path '*/host/bin/apk' | head -1)"
          export APK_BIN OP_COMMIT
          python3 - <<'PY'
          import glob, hashlib, json, os, subprocess
          import yaml

          apk = os.environ["APK_BIN"]
          packages = []
          for path in sorted(glob.glob("/tmp/feed/*.apk")):
              dump = subprocess.check_output([apk, "adbdump", path], text=True)
              info = yaml.safe_load(dump)["info"]
              with open(path, "rb") as handle:
                  digest = hashlib.sha256(handle.read()).hexdigest()
              packages.append(
                  {
                      "name": info["name"],
                      "version": info["version"],
                      "arch": info.get("arch"),
                      "description": (info.get("description") or "").strip(),
                      "depends": info.get("depends") or [],
                      "license": info.get("license"),
                      "origin": info.get("origin"),
                      "filename": os.path.basename(path),
                      "sha256": digest,
                      "size": os.path.getsize(path),
                  }
              )
          manifest = {
              "opPackagesCommit": os.environ["OP_COMMIT"],
              "baseVersion": "25.12.2",
              "generatedAt": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "packages": packages,
          }
          with open("/tmp/feed/manifest.json", "w") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          print(f"manifest: {len(packages)} packages")
          PY
          tar -C /tmp/feed -czf /tmp/extra-feed.tar.gz .
          cp /tmp/extra-feed.tar.gz /tmp/feed/extra-feed.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: extra-feed-${{ env.OP_COMMIT }}
          path: |
            /tmp/extra-feed.tar.gz
            /tmp/feed/manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Publish extra-feed branch
        run: |
          cd /tmp/feed
          git init -b extra-feed
          git config user.name "combinewrt-bot"
          git config user.email "combinewrt-bot@users.noreply.github.com"
          git add -A
          git commit -m "extra feed for op-packages ${OP_COMMIT}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:extra-feed
